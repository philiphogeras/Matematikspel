<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matematikspelet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <!-- Canvas för konfetti -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- UI Overlay -->
    <div id="ui-overlay">
      
      <!-- STARTMENY -->
      <div id="start-screen" class="screen-panel">
        
        <!-- HUVUDMENY -->
        <div id="menu-main" class="menu-step">
          <h1 class="game-title">Matematikspelet</h1>
          <p class="game-subtitle">Välj vad du vill öva på:</p>
          <div class="menu-buttons">
            <button id="btn-category-addition" class="btn-primary btn-add">Addition (+)</button>
            <button id="btn-category-subtraction" class="btn-primary btn-sub">Subtraktion (-)</button>
          </div>
        </div>

        <!-- DELMOMENTSMENY (Ental, Tiotal, Hundratal) -->
        <div id="menu-subcategories" class="menu-step hidden">
          <h2 id="subcat-menu-title" class="game-title">Addition</h2>
          <p class="game-subtitle">Välj delmoment:</p>
          <div class="menu-buttons">
            <button class="btn-subcat" data-cat="ental">1️⃣ Ental</button>
            <button class="btn-subcat" data-cat="tiotal">🔟 Tiotal</button>
            <button class="btn-subcat" data-cat="hundratal">💯 Hundratal</button>
            <button id="btn-back-to-main" class="btn-secondary">← Tillbaka</button>
          </div>
        </div>

        <!-- NIVÅMENY (Brons, Silver, Guld) -->
        <div id="menu-tiers" class="menu-step hidden">
          <h2 id="tier-menu-title" class="game-title">Ental</h2>
          <p class="game-subtitle">Klara varje nivå för att låsa upp nästa:</p>
          <div class="menu-buttons">
            <button id="btn-tier-brons" class="btn-tier btn-bronze" data-tier="brons">
              <div class="tier-info">
                <span class="tier-title">🥉 Brons</span>
                <span class="tier-sub">3 omgångar × 5 tal</span>
              </div>
              <span id="badge-brons" class="tier-status">Öppen</span>
            </button>

            <button id="btn-tier-silver" class="btn-tier btn-silver btn-locked" data-tier="silver" disabled>
              <div class="tier-info">
                <span class="tier-title">🥈 Silver</span>
                <span class="tier-sub">3 omgångar × 5 tal</span>
              </div>
              <span id="badge-silver" class="tier-status">🔒 Låst</span>
            </button>

            <button id="btn-tier-guld" class="btn-tier btn-gold btn-locked" data-tier="guld" disabled>
              <div class="tier-info">
                <span class="tier-title">🥇 Guld</span>
                <span class="tier-sub">3 omgångar × 5 tal</span>
              </div>
              <span id="badge-guld" class="tier-status">🔒 Låst</span>
            </button>

            <button id="btn-back-to-subcats" class="btn-secondary">← Tillbaka</button>
          </div>
        </div>

      </div>

      <!-- SPELSKÄRM -->
      <div id="game-screen" class="screen-panel hidden">
        <div id="top-bar">
          <div id="level-indicator">Ental: Brons</div>
          <div id="round-indicator">Omgång 1/3</div>
          
          <div id="progress-container">
            <div id="progress-bar" class="progress-bronze"></div>
          </div>

          <button id="btn-menu" class="btn-secondary">Meny</button>
        </div>

        <div id="question-box">0 - 0 = ?</div>
        
        <div id="input-area"></div>
        <div id="feedback-message"></div>
      </div>

    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
