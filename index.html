<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matematikspelet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <!-- Canvas för konfetti -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <!-- UI Overlay -->
    <div id="ui-overlay">
      
      <!-- STARTMENY -->
      <div id="start-screen" class="screen-panel">
        
        <!-- HUVUDMENY -->
        <div id="menu-main" class="menu-step">
          <h1 class="game-title">Matematikspelet</h1>
          <p class="game-subtitle">Välj vad du vill öva på:</p>
          <div class="menu-buttons">
            <button id="btn-category-addition" class="btn-primary">Addition (+)</button>
          </div>
        </div>

        <!-- NIVÅMENY FÖR ADDITION -->
        <div id="menu-addition" class="menu-step hidden">
          <h2 class="game-title">Addition</h2>
          <p class="game-subtitle">Välj svårighetsgrad:</p>
          <div class="menu-buttons">
            <button class="btn-tier btn-bronze" data-start="1" data-max="10" data-name="Brons">
              <div class="tier-info">
                <span class="tier-title">🥉 Brons</span>
                <span class="tier-sub">(Nivå 1 – 10)</span>
              </div>
              <span id="badge-brons" class="tier-badge hidden">✓ Klarad!</span>
            </button>

            <button class="btn-tier btn-silver" data-start="11" data-max="20" data-name="Silver">
              <div class="tier-info">
                <span class="tier-title">🥈 Silver</span>
                <span class="tier-sub">(Nivå 11 – 20)</span>
              </div>
              <span id="badge-silver" class="tier-badge hidden">✓ Klarad!</span>
            </button>

            <button class="btn-tier btn-gold" data-start="21" data-max="30" data-name="Guld">
              <div class="tier-info">
                <span class="tier-title">🥇 Guld</span>
                <span class="tier-sub">(Nivå 21 – 30)</span>
              </div>
              <span id="badge-guld" class="tier-badge hidden">✓ Klarad!</span>
            </button>

            <button id="btn-back-to-main" class="btn-secondary">← Tillbaka</button>
          </div>
        </div>

      </div>

      <!-- SPELSKÄRM -->
      <div id="game-screen" class="screen-panel hidden">
        <div id="top-bar">
          <div id="level-indicator">Nivå: 1</div>
          <button id="btn-menu" class="btn-secondary">Meny</button>
        </div>

        <!-- MÄTARE / PROGRESS BAR -->
        <div id="progress-container">
          <div id="progress-bar" class="progress-bronze"></div>
        </div>

        <div id="question-box">0 + 0 = ?</div>
        
        <div id="input-area"></div>
        <div id="feedback-message"></div>
      </div>

    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
