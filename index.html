<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matematikspelet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <!-- Canvas för konfetti -->
    <canvas id="gameCanvas" width="1200" height="800"></canvas>
    
    <!-- UI Overlay -->
    <div id="ui-overlay">
      
      <!-- STARTMENY -->
      <div id="start-screen" class="screen-panel">
        
        <!-- HUVUDMENY -->
        <div id="menu-main" class="menu-step">
          <h1 class="game-title">Matematikspelet</h1>
          <p class="game-subtitle">Välj vad du vill öva på:</p>
          <div class="menu-buttons">
            <button id="btn-category-addition" class="btn-primary btn-add">Addition (+)</button>
            <button id="btn-category-subtraction" class="btn-primary btn-sub">Subtraktion (–)</button>
            <button id="btn-category-multiplication" class="btn-primary btn-mult">Multiplikation (×)</button>
            <button id="btn-category-division" class="btn-primary btn-div">Division (÷)</button>
          </div>
        </div>

        <!-- DELMOMENTSMENY -->
        <div id="menu-subcategories" class="menu-step hidden">
          <h2 id="subcat-menu-title" class="game-title">Addition</h2>
          <p class="game-subtitle">Välj delmoment:</p>
          <div class="menu-buttons">
            <!-- Skapas dynamiskt i MenuManager.js -->
          </div>
        </div>

        <!-- NIVÅMENY -->
        <div id="menu-tiers" class="menu-step hidden">
          <h2 id="tier-menu-title" class="game-title">Ental</h2>
          <p class="game-subtitle">Klara varje nivå för att låsa upp nästa:</p>
          <div class="menu-buttons">
            <button id="btn-tier-brons" class="btn-tier btn-bronze" data-tier="brons">
              <div class="tier-info">
                <span class="tier-title">Brons</span>
                <span class="tier-sub">3 omgångar</span>
              </div>
              <span id="badge-brons" class="tier-status">Öppen</span>
            </button>

            <button id="btn-tier-silver" class="btn-tier btn-silver btn-locked" data-tier="silver" disabled>
              <div class="tier-info">
                <span class="tier-title">Silver</span>
                <span class="tier-sub">3 omgångar</span>
              </div>
              <span id="badge-silver" class="tier-status">Låst</span>
            </button>

            <button id="btn-tier-guld" class="btn-tier btn-gold btn-locked" data-tier="guld" disabled>
              <div class="tier-info">
                <span class="tier-title">Guld</span>
                <span class="tier-sub">3 omgångar</span>
              </div>
              <span id="badge-guld" class="tier-status">Låst</span>
            </button>

            <button id="btn-back-to-subcats" class="btn-secondary">Tillbaka</button>
          </div>
        </div>

      </div>

      <!-- SPELSKÄRM -->
      <div id="game-screen" class="screen-panel hidden">
        <div id="top-bar">
          <div id="level-indicator">Ental: Brons</div>
          <div id="round-indicator">Omgång 1/3</div>
          
          <div id="progress-container">
            <div id="progress-bar" class="progress-bronze"></div>
          </div>

          <button id="btn-menu" class="btn-secondary">Meny</button>
        </div>

        <!-- HUVUDINNEHÅLL (VÄNSTER = SPEL, HÖGER = SKISSRUTA) -->
        <div id="game-body">
          <div id="game-left">
            <div class="question-wrapper">
              <div id="question-box">0 + 0 = ?</div>
              <button id="btn-help" class="btn-help">Hjälp med uträkning</button>
            </div>

            <div id="input-area"></div>
            <div id="feedback-message"></div>
          </div>

          <!-- SKISSRUTA / KLADDBLOCK -->
          <div id="sketchpad-panel" class="sketchpad-panel hidden">
            <div class="sketchpad-header">
              <span class="sketchpad-title">Kladdblock</span>
              <button id="btn-clear-sketch" class="btn-secondary btn-sm">Rensa</button>
            </div>
            <canvas id="sketchCanvas"></canvas>
          </div>
        </div>
      </div>

      <!-- INSTÄLLNINGSMODAL -->
      <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
          <h2 class="modal-title">Inställningar</h2>
          
          <div class="setting-row">
            <label for="volume-slider" class="setting-label">Ljudvolym</label>
            <input type="range" id="volume-slider" min="0" max="100" value="70" class="volume-slider">
          </div>

          <div class="setting-row">
            <button id="btn-toggle-mute" class="btn-secondary btn-full">Ljud: På</button>
          </div>

          <hr class="modal-divider">

          <div class="setting-row">
            <button id="btn-reset-progress" class="btn-danger btn-full">Nollställ alla framsteg</button>
            <p id="reset-confirm-msg" class="setting-hint hidden">Alla sparade framsteg har nollställts.</p>
          </div>

          <div class="modal-actions">
            <button id="btn-close-settings" class="btn-primary btn-full">Stäng</button>
          </div>
        </div>
      </div>

      <!-- HJÄLPMODAL -->
      <div id="help-modal" class="modal-overlay hidden">
        <div class="modal-content help-modal-content">
          <h2 id="help-modal-title" class="modal-title">Hjälp med uträkning</h2>
          
          <div id="vertical-setup" class="vertical-setup"></div>

          <div id="help-instructions" class="help-instructions"></div>

          <div class="modal-actions">
            <button id="btn-close-help" class="btn-primary btn-full">Jag förstår</button>
          </div>
        </div>
      </div>

      <!-- TOPP-KNAPPAR (PENNA OCH KUGGHJUL) -->
      <div class="top-controls">
        <button id="btn-sketch" class="btn-top-icon" aria-label="Skissruta" title="Öppna kladdblock">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </button>

        <button id="btn-settings" class="btn-top-icon" aria-label="Inställningar" title="Inställningar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
